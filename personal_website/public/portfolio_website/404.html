<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space | Adarsh Kumar Singh</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260612_epic_final_v32">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 2rem;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00e5ff 0%, #7b2ff7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0;
            line-height: 1;
            text-shadow: 0 0 40px rgba(0, 229, 255, 0.3);
        }
        
        .error-message {
            font-size: 2rem;
            color: var(--text-bright);
            margin: 1rem 0;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .error-description {
            color: var(--text-silver);
            max-width: 500px;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .zorb-404 {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: alienFloat 4s ease-in-out infinite;
            display: inline-block;
        }
    </style>
</head>
<body class="dark-theme">
    <!-- Starfield Background -->
    <div id="canvas-container"></div>
    <div class="aurora-wrap">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
    </div>
    <div class="noise-overlay"></div>

    <div class="error-container">
        <div class="zorb-404">👽</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Zorb Got Lost In Space</h2>
        <p class="error-description">
            The page you are looking for has been abducted by an autonomous AI swarm or drifted into a black hole.
        </p>
        <a href="https://cyber-duelist.github.io/AI-Apex-Paragon/portfolio/" class="btn btn-primary" style="text-decoration: none;">
            RETURN TO BASE
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Minimal Three.js starfield for the 404 page
        let scene, camera, renderer, stars;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 1;
            camera.rotation.x = Math.PI/2;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            let starGeo = new THREE.BufferGeometry();
            let starCount = 3000;
            let starArr = new Float32Array(starCount * 3);
            let velocities = new Float32Array(starCount);

            for(let i=0; i < starCount * 3; i+=3) {
                starArr[i] = Math.random() * 600 - 300;
                starArr[i+1] = Math.random() * 600 - 300;
                starArr[i+2] = Math.random() * 600 - 300;
                velocities[i/3] = 0;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(starArr, 3));
            starGeo.setAttribute('velocity', new THREE.BufferAttribute(velocities, 1));

            let sprite = new THREE.TextureLoader().load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/textures/sprites/circle.png');
            let starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                map: sprite,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function animate() {
            let positions = stars.geometry.attributes.position.array;
            let vels = stars.geometry.attributes.velocity.array;

            for(let i=0; i<vels.length; i++) {
                vels[i] += 0.005;
                positions[i*3 + 1] -= vels[i];
                if(positions[i*3 + 1] < -200) {
                    positions[i*3 + 1] = 200;
                    vels[i] = 0;
                }
            }
            stars.geometry.attributes.position.needsUpdate = true;
            stars.rotation.y += 0.001;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
