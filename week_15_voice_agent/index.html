<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Streaming Voice Agent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 5px; color: #00e5ff; }
        p.subtitle { color: #aaa; margin-bottom: 40px; }
        
        #record-btn {
            background: linear-gradient(45deg, #00e5ff, #a855f7);
            border: none;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #record-btn:hover { transform: scale(1.05); }
        #record-btn.recording {
            animation: pulse 1.5s infinite;
            background: linear-gradient(45deg, #ff006e, #a855f7);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.6);
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255,0,110,0.5); }
            50% { transform: scale(1.1); box-shadow: 0 0 40px rgba(255,0,110,0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255,0,110,0.5); }
        }
        #record-icon { width: 40px; height: 40px; fill: white; }
        
        .transcript-box {
            margin-top: 40px;
            width: 80%;
            max-width: 600px;
            background: #1e1e24;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            min-height: 100px;
        }
        .user-text { color: #00e5ff; font-weight: bold; }
        .ai-text { color: #a855f7; margin-top: 10px; }
        .status { margin-top: 20px; font-size: 0.9em; color: #888; }
        
        #webcam {
            width: 240px;
            height: 180px;
            border-radius: 12px;
            border: 2px solid #333;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <!-- 3D WebGL Boids Background (Sakana AI Style) -->
    <div id="vanta-bg" style="position: fixed; z-index: -1; width: 100vw; height: 100vh; top: 0; left: 0; opacity: 0.8;"></div>

    <h1>Synapse V</h1>
    <p class="subtitle">Omni-Modal AI (Vision + Voice + Tools)</p>

    <!-- Webcam UI -->
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="capture-canvas" style="display: none;"></canvas>

    <button id="record-btn">
        <svg id="record-icon" viewBox="0 0 24 24">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zm5 10c0 2.8-2.2 5-5 5s-5-2.2-5-5H5c0 3.5 2.6 6.4 6 6.9V22h2v-3.1c3.4-.5 6-3.4 6-6.9h-2z"/>
        </svg>
    </button>

    <div class="status" id="status-text">Disconnected</div>

    <div class="transcript-box">
        <div class="user-text" id="user-transcript">You: ...</div>
        <div class="ai-text" id="ai-transcript">Entropy: ...</div>
    </div>

    <script>
        const recordBtn = document.getElementById('record-btn');
        const statusText = document.getElementById('status-text');
        const userTranscript = document.getElementById('user-transcript');
        const aiTranscript = document.getElementById('ai-transcript');

        let ws;
        let isRecording = false;
        let isAiSpeaking = false;
        let recognition;
        let webcamStream = null;
        
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('capture-canvas');
        const ctx = canvasElement.getContext('2d');

        // --- WEBCAM INITIALIZATION ---
        async function startWebcam() {
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoElement.srcObject = webcamStream;
            } catch (err) {
                console.error("Webcam access denied or unavailable.", err);
            }
        }
        
        // Capture frame every 3 seconds and send if connected
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN && webcamStream && videoElement.videoWidth > 0) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                // Compress highly to keep payload small and inference fast
                const base64Image = canvasElement.toDataURL('image/jpeg', 0.5); 
                ws.send(JSON.stringify({ type: "vision_frame", image: base64Image }));
            }
        }, 3000);
        
        // --- WEBSOCKET CONNECTION ---
        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}/ws/stream`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                if (!isRecording) {
                    statusText.innerText = "Connected to Backend";
                    statusText.style.color = "#00e5ff";
                }
            };

            ws.onmessage = async (event) => {
                if (typeof event.data === "string") {
                    try {
                        const payload = JSON.parse(event.data);
                        if (payload.type === "ai_response_chunk") {
                            aiTranscript.innerText += payload.text;
                        } else if (payload.type === "clear") {
                            aiTranscript.innerText = "Entropy: ";
                        }
                    } catch(e) { console.error(e); }
                } else if (event.data instanceof ArrayBuffer) {
                    playAudioChunk(event.data);
                }
            };

            ws.onclose = () => {
                statusText.innerText = "Disconnected. Reconnecting...";
                statusText.style.color = "#ff006e";
                setTimeout(connectWebSocket, 2000);
            };
        }

        // --- AUDIO PLAYBACK QUEUE ---
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let nextPlayTime = 0;

        async function playAudioChunk(arrayBuffer) {
            try {
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);

                const currentTime = audioContext.currentTime;
                if (nextPlayTime < currentTime) {
                    nextPlayTime = currentTime;
                }
                
                source.start(nextPlayTime);
                nextPlayTime += audioBuffer.duration;
            } catch (err) {
                console.error("Error decoding audio chunk", err);
            }
        }

        // --- SPEECH TO TEXT ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                if (isAiSpeaking) return;

                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: "user_speech", text: finalTranscript }));
                            aiTranscript.innerText = "Entropy: Thinking...";
                            nextPlayTime = 0; // reset queue for new response
                            
                            // Immediately halt recognition to prevent hearing itself start
                            try { recognition.abort(); } catch(e){}
                        }
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                userTranscript.innerText = "You: " + (finalTranscript || interimTranscript);
            };

            // Restart recognition if it ends unexpectedly, but only if it's supposed to be listening
            recognition.onend = () => {
                if (isRecording && !isAiSpeaking) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'aborted') {
                    console.error("Speech recognition error", event.error);
                }
            };
        } else {
            alert("Your browser does not support Web Speech API. Please use Chrome.");
        }

        // --- STATE MACHINE ---
        function updateRecognitionState() {
            if (isRecording && !isAiSpeaking) {
                try { recognition.start(); } catch(e) {}
                recordBtn.classList.add('recording');
                statusText.innerText = "Listening...";
                statusText.style.color = "#ff006e";
            } else {
                try { recognition.abort(); } catch(e) {} // ABORT clears the buffer!
                if (!isRecording) {
                    recordBtn.classList.remove('recording');
                    statusText.innerText = "Connected to Backend";
                    statusText.style.color = "#00e5ff";
                } else {
                    statusText.innerText = "Entropy is speaking...";
                    statusText.style.color = "#a855f7";
                }
            }
        }

        function toggleRecording() {
            if (!isRecording) {
                audioContext.resume();
                isRecording = true;
                userTranscript.innerText = "You: ";
            } else {
                isRecording = false;
            }
            updateRecognitionState();
        }

        recordBtn.addEventListener('click', toggleRecording);

        // Monitor audio queue with a 50ms interval and 0.5s padding for reverb
        setInterval(() => {
            const currentlySpeaking = (nextPlayTime > 0 && audioContext.currentTime < nextPlayTime + 0.6);
            if (currentlySpeaking !== isAiSpeaking) {
                isAiSpeaking = currentlySpeaking;
                updateRecognitionState();
            }
        }, 50);

        // Init
        startWebcam();
        connectWebSocket();
    </script>
    
    <!-- 3D WebGL Engine & Vanta Boids -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            VANTA.BIRDS({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                backgroundColor: 0x0a0a0f, // Deep cyberpunk dark
                color1: 0x00e5ff, // Cyan
                color2: 0xa855f7, // Purple
                colorMode: "variance",
                birdSize: 1.50,
                wingSpan: 30.00,
                speedLimit: 4.00,
                separation: 50.00,
                alignment: 40.00,
                cohesion: 40.00,
                quantity: 4.00 // Optimized for performance
            });
        });
    </script>
</body>
</html>
