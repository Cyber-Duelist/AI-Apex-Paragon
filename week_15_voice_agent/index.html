<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Streaming Voice Agent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #050a15;
            color: #e0e6ed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin-bottom: 5px; color: #4facfe; font-weight: 600; letter-spacing: 1px; }
        p.subtitle { color: #8a9bb2; margin-bottom: 40px; font-weight: 300; }
        
        #record-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }
        #record-btn:hover { transform: scale(1.08); box-shadow: 0 15px 35px rgba(79, 172, 254, 0.5); }
        #record-btn.recording {
            animation: pulse-soothing 2s infinite;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        }
        @keyframes pulse-soothing {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(79, 172, 254, 0.4); }
            50% { transform: scale(1.15); box-shadow: 0 0 40px rgba(79, 172, 254, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(79, 172, 254, 0.4); }
        }
        #record-icon { width: 32px; height: 32px; fill: white; }
        
        .transcript-box {
            margin-top: 40px;
            width: 85%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 120px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .user-text { color: #8a9bb2; font-weight: 400; font-size: 1.05em; line-height: 1.5; }
        .ai-text { color: #ffffff; margin-top: 15px; font-weight: 300; font-size: 1.15em; line-height: 1.6; }
        .status { margin-top: 25px; font-size: 0.9em; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
        
        #webcam {
            width: 280px;
            height: 210px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
            object-fit: cover;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <!-- 3D WebGL Boids Background (Sakana AI Style) -->
    <div id="vanta-bg" style="position: fixed; z-index: -1; width: 100vw; height: 100vh; top: 0; left: 0; opacity: 0.8;"></div>

    <h1>Synapse V</h1>
    <p class="subtitle">Omni-Modal AI (Vision + Voice + Tools)</p>

    <!-- Webcam UI -->
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="capture-canvas" style="display: none;"></canvas>

    <button id="record-btn">
        <svg id="record-icon" viewBox="0 0 24 24">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zm5 10c0 2.8-2.2 5-5 5s-5-2.2-5-5H5c0 3.5 2.6 6.4 6 6.9V22h2v-3.1c3.4-.5 6-3.4 6-6.9h-2z"/>
        </svg>
    </button>

    <div class="status" id="status-text">Disconnected</div>

    <div class="transcript-box">
        <div class="user-text" id="user-transcript">You: ...</div>
        <div class="ai-text" id="ai-transcript">Entropy: ...</div>
    </div>

    <script>
        const recordBtn = document.getElementById('record-btn');
        const statusText = document.getElementById('status-text');
        const userTranscript = document.getElementById('user-transcript');
        const aiTranscript = document.getElementById('ai-transcript');

        let ws;
        let isRecording = false;
        let isAiSpeaking = false;
        let recognition;
        let webcamStream = null;
        
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('capture-canvas');
        const ctx = canvasElement.getContext('2d');

        // --- WEBCAM INITIALIZATION ---
        async function startWebcam() {
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoElement.srcObject = webcamStream;
            } catch (err) {
                console.error("Webcam access denied or unavailable.", err);
            }
        }
        
        // Capture frame every 3 seconds and send if connected
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN && webcamStream && videoElement.videoWidth > 0) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                // Use high quality compression to prevent visual hallucinations (e.g. mistaking a karambit ring for a mug handle)
                const base64Image = canvasElement.toDataURL('image/jpeg', 0.9); 
                ws.send(JSON.stringify({ type: "vision_frame", image: base64Image }));
            }
        }, 3000);
        
        // --- WEBSOCKET CONNECTION ---
        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}/ws/stream`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                if (!isRecording) {
                    statusText.innerText = "Connected to Backend";
                    statusText.style.color = "#00e5ff";
                }
            };

            ws.onmessage = async (event) => {
                if (typeof event.data === "string") {
                    try {
                        const payload = JSON.parse(event.data);
                        if (payload.type === "ai_response_chunk") {
                            aiTranscript.innerText += payload.text;
                        } else if (payload.type === "clear") {
                            aiTranscript.innerText = "Entropy: ";
                        }
                    } catch(e) { console.error(e); }
                } else if (event.data instanceof ArrayBuffer) {
                    playAudioChunk(event.data);
                }
            };

            ws.onclose = () => {
                statusText.innerText = "Disconnected. Reconnecting...";
                statusText.style.color = "#ff006e";
                setTimeout(connectWebSocket, 2000);
            };
        }

        // --- AUDIO PLAYBACK QUEUE ---
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let nextPlayTime = 0;

        async function playAudioChunk(arrayBuffer) {
            try {
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);

                const currentTime = audioContext.currentTime;
                if (nextPlayTime < currentTime) {
                    nextPlayTime = currentTime;
                }
                
                source.start(nextPlayTime);
                nextPlayTime += audioBuffer.duration;
            } catch (err) {
                console.error("Error decoding audio chunk", err);
            }
        }

        // --- SPEECH TO TEXT ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                if (isAiSpeaking) return;

                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: "user_speech", text: finalTranscript }));
                            aiTranscript.innerText = "Entropy: Thinking...";
                            
                            // Thinking state: fast glowing purple birds
                            if (window.vantaEffect) {
                                window.vantaEffect.setOptions({
                                    color1: 0xc471ed,
                                    color2: 0xf64f59,
                                    speedLimit: 10.00,
                                    separation: 100.00,
                                    cohesion: 100.00,
                                    alignment: 10.00
                                });
                            }
                            
                            nextPlayTime = 0; // reset queue for new response
                            try { recognition.abort(); } catch(e){}
                        }
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                userTranscript.innerText = "You: " + (finalTranscript || interimTranscript);
            };

            // Restart recognition if it ends unexpectedly, but only if it's supposed to be listening
            recognition.onend = () => {
                if (isRecording && !isAiSpeaking) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'aborted') {
                    console.error("Speech recognition error", event.error);
                }
            };
        } else {
            alert("Your browser does not support Web Speech API. Please use Chrome.");
        }

        // --- STATE MACHINE ---
        function updateRecognitionState() {
            if (isRecording && !isAiSpeaking) {
                try { recognition.start(); } catch(e) {}
                recordBtn.classList.add('recording');
                statusText.innerText = "Listening...";
                statusText.style.color = "#4facfe";
                
                // Listening state: Calm Cyan Birds
                if (window.vantaEffect) {
                    window.vantaEffect.setOptions({
                        color1: 0x4facfe,
                        color2: 0x00f2fe,
                        speedLimit: 4.00,
                        separation: 50.00,
                        cohesion: 50.00,
                        alignment: 50.00
                    });
                }
            } else {
                try { recognition.abort(); } catch(e) {}
                if (!isRecording) {
                    recordBtn.classList.remove('recording');
                    statusText.innerText = "Connected to Backend";
                    statusText.style.color = "#8a9bb2";
                    
                    // Idle state: Slow gentle Deep Blue
                    if (window.vantaEffect) {
                        window.vantaEffect.setOptions({
                            color1: 0x2b5876,
                            color2: 0x4e4376,
                            speedLimit: 2.00,
                            separation: 60.00,
                            cohesion: 20.00,
                            alignment: 20.00
                        });
                    }
                } else {
                    statusText.innerText = "Entropy is speaking...";
                    statusText.style.color = "#e0e6ed";
                    
                    // Speaking state: Warm energetic Teal/Purple
                    if (window.vantaEffect) {
                        window.vantaEffect.setOptions({
                            color1: 0xa18cd1,
                            color2: 0xfbc2eb,
                            speedLimit: 5.00,
                            separation: 30.00,
                            cohesion: 60.00,
                            alignment: 80.00
                        });
                    }
                }
            }
        }

        function toggleRecording() {
            if (!isRecording) {
                audioContext.resume();
                isRecording = true;
                userTranscript.innerText = "You: ";
            } else {
                isRecording = false;
            }
            updateRecognitionState();
        }

        recordBtn.addEventListener('click', toggleRecording);

        // Monitor audio queue with a 50ms interval and 0.5s padding for reverb
        setInterval(() => {
            const currentlySpeaking = (nextPlayTime > 0 && audioContext.currentTime < nextPlayTime + 0.6);
            if (currentlySpeaking !== isAiSpeaking) {
                isAiSpeaking = currentlySpeaking;
                updateRecognitionState();
            }
        }, 50);

        // Init
        startWebcam();
        connectWebSocket();
    </script>
    
    <!-- 3D WebGL Engine & Vanta Boids -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.vantaEffect = VANTA.BIRDS({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                backgroundColor: 0x050a15, // Soothing deep dark blue
                color1: 0x2b5876, 
                color2: 0x4e4376, 
                colorMode: "variance",
                birdSize: 1.50,
                wingSpan: 30.00,
                speedLimit: 2.00,
                separation: 60.00,
                alignment: 20.00,
                cohesion: 20.00,
                quantity: 4.00 
            });
        });
    </script>
</body>
</html>
