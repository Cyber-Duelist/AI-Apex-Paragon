name: Agent Evaluation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Evaluation
        # This assumes your eval script is in the production_agent folder
        # Update the path if your structure differs
        run: python week_12/production_agent/eval.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}