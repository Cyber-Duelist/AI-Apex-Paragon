services:
  - type: web
    name: persona-doc-api
    env: python
    buildCommand: pip install -r week_09/requirements.txt && python week_09/persona_doc/download_model.py
    startCommand: cd week_09/persona_doc && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"

  - type: web
    name: nexus-churn-api
    env: python
    buildCommand: pip install -r customer-churn-predictor/backend/requirements.txt
    startCommand: cd customer-churn-predictor/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false